[project]
name = "prova-backend-erp-ia-eduardo-chaves"
version = "0.1.0"
description = "API FastAPI para produtos, estoque, concorrência e agente determinístico"
readme = "README.md"
authors = [
    { name = "Eduardo Oliveira", email = "eduardodeoliveirachaves7@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.16.5",
    "arq>=0.26.3",
    "asyncpg>=0.30.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pwdlib[argon2]>=0.2.1",
    "pydantic-settings>=2.10.1",
    "pyjwt>=2.10.1",
    "python-multipart>=0.0.20",
    "redis>=5.2.1,<6",
    "sqlalchemy[asyncio]>=2.0.43",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "mypy>=1.18.2",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "ruff>=0.13.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
ignore = ["B008", "BLE001"]

[project.scripts]
prova-backend-erp-ia-eduardo-chaves = "app:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
