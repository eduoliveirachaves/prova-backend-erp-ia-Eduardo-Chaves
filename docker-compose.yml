services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-erp}
      POSTGRES_USER: ${POSTGRES_USER:-erp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-erp}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://erp:erp@postgres:5432/erp}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JWT_SECRET: ${JWT_SECRET:-replace-with-at-least-32-random-characters}
      DEMO_USERNAME: ${DEMO_USERNAME:-admin}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-admin123}
      LOW_STOCK_THRESHOLD: ${LOW_STOCK_THRESHOLD:-10}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-300}
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    build: .
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://erp:erp@postgres:5432/erp}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JWT_SECRET: ${JWT_SECRET:-replace-with-at-least-32-random-characters}
      DEMO_USERNAME: ${DEMO_USERNAME:-admin}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-admin123}
      LOW_STOCK_THRESHOLD: ${LOW_STOCK_THRESHOLD:-10}
    command: ["arq", "app.worker.WorkerSettings"]
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy

  test:
    build:
      context: .
      target: test
    environment:
      API_URL: http://app:8000
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://erp:erp@postgres:5432/erp}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JWT_SECRET: ${JWT_SECRET:-replace-with-at-least-32-random-characters}
      DEMO_USERNAME: ${DEMO_USERNAME:-admin}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-admin123}
      LOW_STOCK_THRESHOLD: ${LOW_STOCK_THRESHOLD:-10}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-300}
    command: ["sh", "-c", "pytest -q && ruff check . && mypy src tests"]
    depends_on:
      app:
        condition: service_healthy
      worker:
        condition: service_started
    profiles: ["test"]

volumes:
  postgres_data:
  redis_data:
